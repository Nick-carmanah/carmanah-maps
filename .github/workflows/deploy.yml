name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Our Sentinel-2 satellite file on R2 (public URL), e.g.
          # https://<bucket address>/imagery/s2-quarterly/bc/2026-q3.pmtiles.
          # Empty: satellite is Esri World Imagery, online only. See
          # src/map/satellite-source.ts and scripts/imagery/README.md.
          VITE_SATELLITE_PMTILES_URL: ''
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
